# Configuration for a wandb sweep
# Running the following command under the hood:

program: train_rsl_rl.py
description: "bpo training with random seeds"
name: BPO_value_g1_rough_random_seeds_clip02_epoch10
method: grid
metric:
  goal: maximize
  name: total_reward
parameters:
  agent.seed:
    values: [1, 2, 3, 4, 5]
  agent.algorithm.use_median:
    values: [False]

command:
  - python
  - ${program}
  - "--headless"
  - "--task=Isaac-Velocity-Rough-G1-v0"
  - "--logger=wandb"
  - ${args_no_hyphens}
