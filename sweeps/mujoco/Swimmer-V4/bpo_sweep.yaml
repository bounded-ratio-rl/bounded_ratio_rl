program: train.py
name: sweep_Swimmer_bpo
method: bayes
metric:
  goal: maximize
  name: rollout/ep_rew_mean
parameters:
  env:
    values: [mujoco]
  algo:
    values: [bpo/mujoco]
  env.env_id:
    values: ["Swimmer-v4"]
  training.seed:
    values: [1]
  env.n_envs:
    values: [4]
  algo.n_steps:
    values: [512]
  algo.learning_rate:
    values: [0.0001]
  algo.clip_ratio:
    values: [0.1, 0.2, 0.3]
  algo.batch_size:
    values: [128, 256, 512]
  algo.n_epochs:
    values: [5, 10, 20]
  algo.lambda_:
    values: [0.001, 1.0, 10.0]
  algo.gamma:
    values: [0.999, 0.9999]

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
