# @package algo
_convert_: all
_target_: stable_baselines3.PPO
policy: "MlpPolicy"
policy_kwargs:
  ortho_init: true
  activation_fn:
    _target_: hydra.utils.get_class
    path: torch.nn.ReLU
  net_arch:
    pi: [256, 256] # 256 for others
    vf: [256, 256]
  log_std_init: 0.0 # -2.0 for humanoid

# Training hyperparameters
batch_size: 64
gae_lambda: 0.95
n_steps: 2048
gamma: 0.99
n_epochs: 10
ent_coef: 0.0
learning_rate: 0.0003
clip_range: 0.2
max_grad_norm: 0.5
vf_coef: 0.5
normalize_advantage: true
